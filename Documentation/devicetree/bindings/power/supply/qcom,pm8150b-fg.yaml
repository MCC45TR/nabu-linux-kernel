%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/qcom,pm8150b-fg.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm PM8150B fuel gauge

maintainers:
  - Senemos Nabu Kernel Team <mcc45tr@users.noreply.github.com>

allOf:
  - $ref: power-supply.yaml#

properties:
  compatible:
    const: qcom,pm8150b-fg

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  interrupt-names:
    const: soc-delta

  monitored-battery: true

  power-supplies: true

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/spmi/spmi.h>

    spmi {
        #address-cells = <2>;
        #size-cells = <0>;

        pmic@2 {
            compatible = "qcom,pm8150b", "qcom,spmi-pmic";
            reg = <0x2 SPMI_USID>;
            #address-cells = <1>;
            #size-cells = <0>;

            fuel-gauge@4000 {
                compatible = "qcom,pm8150b-fg";
                reg = <0x4000>;
                interrupts = <0x2 0x40 0x3 IRQ_TYPE_EDGE_RISING>;
                interrupt-names = "soc-delta";
            };
        };
    };
...
