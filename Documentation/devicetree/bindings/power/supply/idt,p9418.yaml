%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/idt,p9418.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: IDT P9418 wireless power transmitter

maintainers:
  - MCC45TR <mcc45tr@users.noreply.github.com>

description: |
  IDT P9418 transmitter used by Xiaomi Pad 5 for stylus detection, reverse
  wireless charging, charge-state monitoring and stylus Bluetooth MAC
  reporting.

properties:
  compatible:
    const: idt,p9418

  reg:
    maxItems: 1

  idt,irq-gpios:
    maxItems: 1

  idt,hall3-gpios:
    maxItems: 1

  idt,hall4-gpios:
    maxItems: 1

  idt,reverse-enable-gpios:
    maxItems: 1

  idt,reverse-boost-enable-gpios:
    maxItems: 1

required:
  - compatible
  - reg
  - idt,irq-gpios
  - idt,hall3-gpios
  - idt,hall4-gpios
  - idt,reverse-enable-gpios
  - idt,reverse-boost-enable-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        wireless-power@3b {
            compatible = "idt,p9418";
            reg = <0x3b>;
            idt,irq-gpios = <&tlmm 95 GPIO_ACTIVE_HIGH>;
            idt,hall3-gpios = <&tlmm 101 GPIO_ACTIVE_HIGH>;
            idt,hall4-gpios = <&tlmm 134 GPIO_ACTIVE_HIGH>;
            idt,reverse-enable-gpios = <&tlmm 3 GPIO_ACTIVE_HIGH>;
            idt,reverse-boost-enable-gpios = <&tlmm 47 GPIO_ACTIVE_HIGH>;
        };
    };
