%YAML 1.2
---
$id: http://devicetree.org/schemas/media/qcom,sm8150-camss.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm SM8150 Camera Subsystem

maintainers:
  - Robert Foss <rfoss@kernel.org>

description: |
  The SM8150 CAMSS contains four CSI PHYs, two CSI decoders and two
  Image Front Ends. This binding describes the two full IFE paths used by
  board camera sensors; the two lite paths are outside this initial support.

properties:
  compatible:
    const: qcom,sm8150-camss

  clocks:
    minItems: 31
    maxItems: 31

  clock-names:
    items:
      - const: camnoc_axi
      - const: cpas_ahb
      - const: cphy_rx_src
      - const: csi0
      - const: csi0_src
      - const: csi1
      - const: csi1_src
      - const: csiphy0
      - const: csiphy0_timer
      - const: csiphy0_timer_src
      - const: csiphy1
      - const: csiphy1_timer
      - const: csiphy1_timer_src
      - const: csiphy2
      - const: csiphy2_timer
      - const: csiphy2_timer_src
      - const: csiphy3
      - const: csiphy3_timer
      - const: csiphy3_timer_src
      - const: gcc_camera_ahb
      - const: gcc_camera_axi
      - const: slow_ahb_src
      - const: soc_ahb
      - const: vfe0
      - const: vfe0_axi
      - const: vfe0_cphy_rx
      - const: vfe0_src
      - const: vfe1
      - const: vfe1_axi
      - const: vfe1_cphy_rx
      - const: vfe1_src

  interconnects:
    minItems: 3
    maxItems: 3

  interconnect-names:
    items:
      - const: cam_ahb
      - const: cam_hf_0_mnoc
      - const: cam_sf_0_mnoc

  interrupts:
    minItems: 8
    maxItems: 8

  interrupt-names:
    items:
      - const: csid0
      - const: csid1
      - const: csiphy0
      - const: csiphy1
      - const: csiphy2
      - const: csiphy3
      - const: vfe0
      - const: vfe1

  iommus:
    minItems: 8
    maxItems: 8

  power-domains:
    minItems: 3
    maxItems: 3

  power-domain-names:
    items:
      - const: ife0
      - const: ife1
      - const: top

  reg:
    minItems: 8
    maxItems: 8

  reg-names:
    items:
      - const: csid0
      - const: csid1
      - const: csiphy0
      - const: csiphy1
      - const: csiphy2
      - const: csiphy3
      - const: vfe0
      - const: vfe1

  vdda-phy-supply:
    description: 0.88 V supply for the CSI PHY core blocks.

  vdda-pll-supply:
    description: 1.2 V supply for the CSI PHY reference-clock PLL blocks.

  ports:
    $ref: /schemas/graph.yaml#/properties/ports
    description: CSI input ports, one for each CSI PHY.

    patternProperties:
      "^port@[0-3]$":
        $ref: /schemas/graph.yaml#/$defs/port-base
        unevaluatedProperties: false

        properties:
          endpoint:
            $ref: /schemas/media/video-interfaces.yaml#
            unevaluatedProperties: false

            properties:
              data-lanes:
                minItems: 1
                maxItems: 4

            required:
              - data-lanes

required:
  - clock-names
  - clocks
  - compatible
  - interconnect-names
  - interconnects
  - interrupt-names
  - interrupts
  - iommus
  - power-domain-names
  - power-domains
  - reg
  - reg-names
  - vdda-phy-supply
  - vdda-pll-supply
  - ports

additionalProperties: false
...
