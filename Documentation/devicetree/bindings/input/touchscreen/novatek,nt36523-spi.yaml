%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/novatek,nt36523-spi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NT36523 SPI touchscreen controller

maintainers:
  - Senemos Nabu Kernel Team <mcc45tr@users.noreply.github.com>

allOf:
  - $ref: touchscreen.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: novatek,nt36523-spi

  reg:
    maxItems: 1

  spi-max-frequency:
    maximum: 9600000

  irq-gpios:
    maxItems: 1

  firmware-name:
    maxItems: 1

  novatek,pen-support:
    type: boolean
    description: Enable the controller's active-pen input path.

  novatek,wgp-stylus:
    type: boolean
    description: Enable Novatek WGP stylus protocol support.

  novatek,double-tap-to-wake:
    type: boolean
    description: Keep gesture detection armed for double-tap wake.

  novatek,swrst-n8-addr:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Controller software-reset register address.

  novatek,spi-rd-fast-addr:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Optional fast SPI-read command register address.

  wakeup-source: true

required:
  - compatible
  - reg
  - spi-max-frequency
  - irq-gpios
  - firmware-name
  - novatek,swrst-n8-addr

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@0 {
            compatible = "novatek,nt36523-spi";
            reg = <0>;
            spi-max-frequency = <9600000>;
            irq-gpios = <&tlmm 39 GPIO_ACTIVE_LOW>;
            firmware-name = "novatek/novatek_nt36523_fw.bin";
            novatek,swrst-n8-addr = <0x03f0fe>;
        };
    };
...
