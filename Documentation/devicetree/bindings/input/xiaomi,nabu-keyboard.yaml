%YAML 1.2
---
$id: http://devicetree.org/schemas/input/xiaomi,nabu-keyboard.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Xiaomi Pad 5 pogo keyboard-cover controller

maintainers:
  - MCC45TR <mcc45tr@users.noreply.github.com>

description: |
  The Xiaomi Pad 5 contains a USB keyboard controller whose power, reset and
  physical cover-detect signals are wired to TLMM GPIOs. The controller
  powers the keyboard cover through its pogo connector.

properties:
  compatible:
    const: xiaomi,nabu-keyboard

  vdd-gpios:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  detect-gpios:
    maxItems: 1

  pinctrl-names:
    items:
      - const: default
      - const: sleep

  pinctrl-0: true
  pinctrl-1: true
  wakeup-source: true

required:
  - compatible
  - vdd-gpios
  - reset-gpios
  - detect-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    keyboard-cover {
        compatible = "xiaomi,nabu-keyboard";
        vdd-gpios = <&tlmm 82 GPIO_ACTIVE_HIGH>;
        reset-gpios = <&tlmm 49 GPIO_ACTIVE_LOW>;
        detect-gpios = <&tlmm 41 GPIO_ACTIVE_LOW>;
        wakeup-source;
    };
